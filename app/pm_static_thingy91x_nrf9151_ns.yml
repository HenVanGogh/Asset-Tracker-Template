# Static Partition Manager layout for Thingy:91X (nRF9151 NS)
#
# WARNING: Do NOT modify addresses or sizes without reflashing the device
# with a full JLink hex (merged.hex). FOTA writes to mcuboot_secondary and
# MCUboot swaps at mcuboot_primary — both must match exactly.
#
# FOTA update file : app/build/dfu_application.zip
# First full flash : app/build/merged.hex  (via JLink / nrfutil device program)
# Subsequent OTA   : MQTT {"command":"fota_start","url":"https://t4as.org/..."}
#
# Internal flash (1 MB, 0x00000-0xFFFFF)
# ----------------------------------------
# 0x00000  b0 / NSIB        32 KB  secure boot
# 0x08000  s0 (mcuboot)     80 KB  primary MCUboot slot
# 0x1C000  s1 (mcuboot)     80 KB  redundant MCUboot slot
# 0x30000  mcuboot_primary 832 KB  pad(0x200) + TF-M(0x7E00) + app(0xC8000)
#
# External flash (32 MB, 0x000000-0x1FFFFFF on QSPI)
# ----------------------------------------
# 0x000000 mcuboot_secondary 832 KB  OTA staging (must == primary size)
# 0x0D0000 fmfu_storage        4 MB  full modem FW update
# 0x4D0000 settings_storage    8 KB  Zephyr settings / NVS
# 0x4D2000 nrf5340_dfu       512 KB  nRF5340 firmware staging (half of 1 MB flash)
# 0x552000 nrf52840_dfu      512 KB  nRF52840 firmware staging (half of 1 MB flash)

# --- Internal flash ---

b0:
  address: 0x0
  region: flash_primary
  size: 0x8000

b0_container:
  address: 0x0
  size: 0x8000
  region: flash_primary
  span: [b0]

s0:
  address: 0x8000
  size: 0x14000
  span: [mcuboot, s0_pad]
  region: flash_primary

s0_pad:
  address: 0x8000
  region: flash_primary
  size: 0x200
  share_size: [mcuboot_pad]

s0_image:
  address: 0x8200
  size: 0x13e00
  span: [mcuboot]
  region: flash_primary

mcuboot:
  address: 0x8200
  region: flash_primary
  size: 0x13e00

s1:
  address: 0x1c000
  size: 0x14000
  span: [s1_pad, s1_image]
  region: flash_primary

s1_pad:
  address: 0x1c000
  region: flash_primary
  size: 0x200
  share_size: [mcuboot_pad]

s1_image:
  address: 0x1c200
  region: flash_primary
  size: 0x13e00
  share_size: [mcuboot]

mcuboot_primary:
  address: 0x30000
  size: 0xD0000
  span: [mcuboot_pad, app, tfm]
  region: flash_primary

tfm_secure:
  address: 0x30000
  size: 0x8000
  span: [mcuboot_pad, tfm]
  region: flash_primary

mcuboot_pad:
  address: 0x30000
  region: flash_primary
  size: 0x200

mcuboot_primary_app:
  address: 0x30200
  size: 0xcfe00
  span: [tfm, app]
  region: flash_primary

app_image:
  address: 0x30200
  size: 0xcfe00
  span: [tfm, app]
  region: flash_primary

tfm:
  address: 0x30200
  region: flash_primary
  size: 0x7e00

tfm_nonsecure:
  address: 0x38000
  size: 0xc8000
  span: [app]
  region: flash_primary

app:
  address: 0x38000
  region: flash_primary
  size: 0xc8000

# --- External flash (QSPI) ---

mcuboot_secondary:
  address: 0x0
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash
  size: 0xd0000
  share_size: [mcuboot_primary]

fmfu_storage:
  address: 0xd0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash
  size: 0x400000

settings_storage:
  address: 0x4d0000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash
  size: 0x2000

# DFU staging slots for companion chips (downloaded via MQTT, sent via SPI)
# nRF5340 has 1 MB flash — reserve half (512 KB) for its firmware image
nrf5340_dfu:
  address: 0x4d2000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash
  size: 0x80000

# nRF52840 has 1 MB flash — reserve half (512 KB) for its firmware image
nrf52840_dfu:
  address: 0x552000
  device: DT_CHOSEN(nordic_pm_ext_flash)
  region: external_flash
  size: 0x80000
