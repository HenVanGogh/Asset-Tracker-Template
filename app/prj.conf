CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="Asset Tracker Template"
CONFIG_NCS_SAMPLES_DEFAULTS=y
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1280

# Logging - Both RTT and UART backends enabled
# RTT: For J-Link debugging
# UART: For USB logging via nRF5340 connectivity bridge (UART0 -> CDC ACM)
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_OUTPUT_TEXT=y
# Use different RTT channels for logging and shell
CONFIG_LOG_BACKEND_RTT_BUFFER=0
CONFIG_SHELL_BACKEND_RTT_BUFFER=1
CONFIG_DK_LIBRARY=y
CONFIG_ZVFS_OPEN_MAX=10
CONFIG_PWM=y

#JSON
CONFIG_CJSON_LIB=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# TFM logging over uart0 - keep enabled to avoid build errors
CONFIG_TFM_LOG_LEVEL_SILENCE=n
CONFIG_TFM_SECURE_UART0=n
#CONFIG_TFM_SECURE_UART_SHARE_INSTANCE=n
CONFIG_TFM_EXCEPTION_INFO_DUMP=y
CONFIG_TFM_SPM_LOG_LEVEL_DEBUG=y

# Heap and stacks
CONFIG_MAIN_STACK_SIZE=2560
# Extended AT host/monitor stack/heap sizes since some nrf_cloud credentials are longer than 1024 bytes.
CONFIG_AT_MONITOR_HEAP_SIZE=2176
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_HEAP_MEM_POOL_IGNORE_MIN=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1280

# Enable Networking and Connection Manager.
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_POSIX_API=y

# Enable LTE Connectivity using Connection Manager
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_NET_CONNECTION_MANAGER_MONITOR_STACK_SIZE=512
CONFIG_NRF_MODEM_LIB_NET_IF=y
CONFIG_NRF_MODEM_LIB_NET_IF_AUTO_DOWN=y
CONFIG_NRF_MODEM_LIB_NET_IF_DOWN_DEFAULT_LTE_DISCONNECT=y

# Enable Link Controller modules
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_EDRX_MODULE=y
CONFIG_LTE_LC_CONN_EVAL_MODULE=y

# Default: high-power mode — PSM and eDRX not requested at startup.
# The modem stays always-on by default for reliable FOTA and MQTT.
# Runtime switching is fully available: LTE_LC_PSM_MODULE and LTE_LC_EDRX_MODULE
# are compiled in so lte_lc_psm_req(true/false) / lte_lc_edrx_req(true/false)
# can be called at any time without reflashing.
# The timing parameters below remain active as defaults for runtime use —
# they are governed by LTE_LC_PSM_MODULE, not by LTE_PSM_REQ.
# To request PSM/eDRX at startup too, change the two REQ lines to =y.
CONFIG_LTE_LC_WORKQUEUE_STACK_SIZE=768
CONFIG_LTE_PSM_REQ=n
CONFIG_LTE_PROPRIETARY_PSM_REQ=y
CONFIG_LTE_PSM_REQ_FORMAT_SECONDS=y
# Set Requested TAU to a large value. Network uses the largest it supports.
# Should be larger than the default telemetry update interval (1 hour).
CONFIG_LTE_PSM_REQ_RPTAU_SECONDS=7200
# Short active time — we hold the connection open ourselves via MQTT polling.
CONFIG_LTE_PSM_REQ_RAT_SECONDS=6
CONFIG_LTE_EDRX_REQ=n
# "0000" = 5.12 s eDRX cycle — used when eDRX is enabled at runtime.
CONFIG_LTE_EDRX_REQ_VALUE_LTE_M="0000"
CONFIG_LTE_EDRX_REQ_VALUE_NBIOT="0000"

# Modem library
CONFIG_NRF_MODEM_LIB=y

# AT commands interface
CONFIG_SHELL=y
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_STACK_SIZE=2048
CONFIG_SHELL_CMD_BUFF_SIZE=2048
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_AT_SHELL=y
CONFIG_LTE_SHELL=n

# Disable the default nRF Cloud module
CONFIG_APP_CLOUD=n

# Disable nRF Cloud and enable custom MQTT
CONFIG_NRF_CLOUD=n
CONFIG_NRF_CLOUD_COAP=n
CONFIG_NRF_CLOUD_COAP_DISCONNECT_ON_FAILED_REQUEST=n
CONFIG_MODEM_JWT=n
CONFIG_NRF_CLOUD_PRINT_DETAILS=n

# Custom MQTT Configuration for t4as.org
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y

# JSON support for custom MQTT module
CONFIG_JSON_LIBRARY=y

# Enable custom MQTT module
CONFIG_APP_CUSTOM_MQTT=y
CONFIG_APP_CUSTOM_MQTT_LOG_LEVEL_DBG=y
CONFIG_APP_CUSTOM_MQTT_USE_TLS=n
CONFIG_APP_CUSTOM_MQTT_BROKER_HOSTNAME="217.154.155.83"
CONFIG_APP_CUSTOM_MQTT_BROKER_PORT=1883
CONFIG_APP_CUSTOM_MQTT_USERNAME="mqttuser"
CONFIG_APP_CUSTOM_MQTT_PASSWORD="mqttuser"
CONFIG_APP_CUSTOM_MQTT_PUBLISH_TOPIC="gateway/thingy91x-asset-tracker/data"
CONFIG_APP_CUSTOM_MQTT_SUBSCRIBE_TOPIC="gateway/thingy91x-asset-tracker/command"
CONFIG_APP_CUSTOM_MQTT_DEVICE_ID="remote_sensor_2"

# Enable button module for location triggering
CONFIG_APP_BUTTON=y
CONFIG_APP_BUTTON_LOG_LEVEL_DBG=y

# Enable location module for MQTT reporting
CONFIG_APP_LOCATION=y
CONFIG_APP_ENVIRONMENTAL=y

# POWER
# Power module - temporarily disabled due to secure fault
#CONFIG_APP_POWER=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_I2C=y

CONFIG_APP_UART_SENSOR=y
CONFIG_APP_UART_SENSOR_LINE_BUFFER_SIZE=256
CONFIG_APP_UART_SENSOR_RX_BUFFER_SIZE=512
CONFIG_APP_UART_SENSOR_MSG_QUEUE_SIZE=64
CONFIG_APP_UART_SENSOR_ZBUS_TIMEOUT_MS=10

# ESL BLE Access Point integration via nRF5340 shell
CONFIG_APP_UART_SENSOR_ESL_POLL_INTERVAL_SEC=300
CONFIG_APP_UART_SENSOR_ESL_MAX_TAGS=16
CONFIG_APP_UART_SENSOR_ESL_EXPECTED_TAGS=3

# UART configuration — serial still needed for UART0 (USB log bridge)
CONFIG_SERIAL=y

# SPI — used for nRF9151 ↔ nRF5340 inter-chip link (replaced UART1)
CONFIG_SPI=y


# On initial connection to the cloud, add info sections to the shadow
CONFIG_MODEM_INFO=y
CONFIG_MODEM_INFO_ADD_DEVICE=y
# CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS=y
# CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS_NETWORK=y
# CONFIG_NRF_CLOUD_SEND_DEVICE_STATUS_SIM=y
# CONFIG_NRF_CLOUD_SEND_SERVICE_INFO_FOTA=y

# MCUBOOT - Needed by FOTA
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH_ERASE=y

# Date Time lib - Used by PGPS and main application
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_THREAD_STACK_SIZE=576

CONFIG_SETTINGS=y
CONFIG_SETTINGS_FCB=y
CONFIG_FCB=y

# Downloader - used by FOTAS
CONFIG_DOWNLOADER=y
CONFIG_DOWNLOADER_STACK_SIZE=4096

# Flash - Used by FOTA
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
# CONFIG_NRF_CLOUD_LOG_DIRECT=n
# CONFIG_NRF_CLOUD_LOG_OUTPUT_LEVEL=3
# CONFIG_NRF_CLOUD_FOTA_POLL=y
# CONFIG_NRF_CLOUD_FOTA_POLL_LOG_LEVEL_DBG=y
# CONFIG_NRF_CLOUD_FOTA_FULL_MODEM_UPDATE=y
# CONFIG_NRF_CLOUD_FOTA_DOWNLOAD_FRAGMENT_SIZE=1900
# CONFIG_NRF_CLOUD_COAP_DOWNLOADS=y
CONFIG_FOTA_DOWNLOAD=y
CONFIG_FOTA_DOWNLOAD_PROGRESS_EVT=y
CONFIG_FOTA_DL_TIMEOUT_MIN=60
CONFIG_FOTA_SOCKET_RETRIES=5
CONFIG_DFU_TARGET=y
CONFIG_DFU_TARGET_MCUBOOT=y

# Credentials
# CONFIG_NRF_CLOUD_CLIENT_ID_SRC_INTERNAL_UUID=y
# CONFIG_NRF_CLOUD_CHECK_CREDENTIALS=y
# CONFIG_NRF_CLOUD_CREDENTIALS_MGMT_MODEM=y

# COAP client
CONFIG_COAP_MAX_RETRANSMIT=5
CONFIG_COAP_INIT_ACK_TIMEOUT_MS=5000
# Set CoAP therad to same priority as other modules
CONFIG_COAP_CLIENT_THREAD_PRIORITY=14
CONFIG_COAP_CLIENT_BLOCK_SIZE=1024
CONFIG_COAP_CLIENT_MESSAGE_SIZE=1024
CONFIG_COAP_CLIENT_STACK_SIZE=1280
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=192

# needed for processing floats
CONFIG_PICOLIBC=y
CONFIG_FPU=y

# Zbus
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=256
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=256
CONFIG_ZBUS_CHANNEL_NAME=y
# Increase ZBUS runtime statistics for debugging
CONFIG_ZBUS_RUNTIME_OBSERVERS=y
# CONFIG_HEAP_MEM_POOL_ADD_SIZE_ZBUS=4096


# Zephyr State Machine Framework
CONFIG_SMF=y
CONFIG_SMF_ANCESTOR_SUPPORT=y
CONFIG_SMF_INITIAL_TRANSITION=y

# Location
CONFIG_LOCATION=y
CONFIG_LOCATION_DATA_DETAILS=y
CONFIG_LOCATION_METHOD_GNSS=y
CONFIG_LOCATION_METHOD_CELLULAR=y
CONFIG_LOCATION_SERVICE_EXTERNAL=y
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_TIMEOUT=60000
CONFIG_LOCATION_REQUEST_DEFAULT_CELLULAR_TIMEOUT=30000
CONFIG_LOCATION_REQUEST_DEFAULT_TIMEOUT=120000
CONFIG_LOCATION_REQUEST_DEFAULT_CELLULAR_CELL_COUNT=3
CONFIG_LOCATION_REQUEST_DEFAULT_GNSS_VISIBILITY_DETECTION=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y
# CONFIG_NRF_CLOUD_AGNSS=y

# Location module stack size - increased for stability
CONFIG_APP_LOCATION_THREAD_STACK_SIZE=4096

# Not for LTE throughput testing
CONFIG_NRF_MODEM_LIB_SHMEM_TX_SIZE=4096
CONFIG_NRF_MODEM_LIB_SHMEM_RX_SIZE=4096

# For nRF9160 the default is socket interface
CONFIG_NET_DEFAULT_IF_ETHERNET=y
CONFIG_MBEDTLS=n

# Disable problematic entropy sources that require missing crypto libraries
CONFIG_ENTROPY_CC3XX=n
#CONFIG_ENTROPY_PSA_CRYPTO=n

# Use standard software entropy source
CONFIG_ENTROPY_GENERATOR=y
CONFIG_XOSHIRO_RANDOM_GENERATOR=y

# Networking
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_NET_CONTEXT_SYNC_RECV=y

# Memory configurations
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8
CONFIG_NET_PKT_RX_COUNT=1
CONFIG_NET_PKT_TX_COUNT=1
CONFIG_NET_TX_STACK_SIZE=512
CONFIG_NET_RX_STACK_SIZE=512
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_MAX_CONTEXTS=5
CONFIG_NET_MGMT_EVENT_STACK_SIZE=1280

# Needed due to using connectivity manager
CONFIG_NET_IF_MAX_IPV6_COUNT=2
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# For debugging purposes
CONFIG_THREAD_NAME=y

# Extra Logging
# FOTA: HTTP/HTTPS firmware update triggered via MQTT command.
# TLS: ISRG Root X1 (Let's Encrypt) provisioned at sec_tag 16842754.
# Provision once via AT shell:  AT%CMNG=0,16842754,0,"<ISRG_ROOT_X1_PEM>"
# See docs/FOTA_PROVISIONING.md for full procedure.
CONFIG_APP_FOTA=y
CONFIG_APP_FOTA_SEC_TAG=16842754
# CONFIG_APP_FOTA_LOG_LEVEL_DBG=y
CONFIG_APP_LOCATION_LOG_LEVEL_DBG=y
CONFIG_APP_CLOUD_LOG_LEVEL_DBG=y
CONFIG_APP_NETWORK_LOG_LEVEL_DBG=y
CONFIG_APP_LOG_LEVEL_DBG=y

# Task Watchdog
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_CHANNELS=8
CONFIG_TASK_WDT_MIN_TIMEOUT=10000

# Device power management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SHELL=y
