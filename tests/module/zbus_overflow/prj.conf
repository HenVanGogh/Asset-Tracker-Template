CONFIG_UNITY=y
CONFIG_ZBUS=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ZBUS_OBSERVER_NAME=y
CONFIG_ZBUS_CHANNEL_NAME=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_ISOLATION=n
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=n

# Deliberately keep the buffer pool tight so the overflow tests can
# exhaust it within a handful of publishes.
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=4
